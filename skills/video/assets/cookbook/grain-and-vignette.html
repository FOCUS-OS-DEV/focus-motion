<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Cookbook: grain-and-vignette
      What    A film grain and darkened corners over a whole scene, so flat colours and gradients look less
              synthetic. Here they lie over two drifting lights and a title.
      How     The grain is drawn once, before the timeline: a small canvas of seeded black and white specks with a
              low random opacity becomes a repeating background image on one layer. The vignette is one radial
              gradient. Both layers are the last children of the root, outside the camera wrapper.
      Change  GRAIN (strength, 0.08 to 0.2), GRAIN_PX (speck size), TILE, and the two stops of the vignette. Colours
              of the demo scene in :root.
      Traps   Grain inside anything that scales or moves swims and shimmers: it stays outside the camera. Grain that
              changes every frame costs file size and turns to mush when the video is compressed: it stays still.
              A 1 px speck mostly disappears in the final file, so the specks are 2 px. No blend mode and no CSS
              filter are needed, and both would slow every frame down.
    -->
    <style>
      /* fonts:start */
      @font-face { font-family: "Rubik"; src: url("assets/Rubik-VF.ttf") format("truetype"); font-weight: 300 900; }
      /* fonts:end */
      :root {
        --w: 1080px; --h: 1920px;
        --safe-top: 250px; --safe-bottom: 350px; --safe-left: 80px; --safe-right: 80px; --safe-right-low: 140px;
        --stage-bg: #0f1216;
        /* restyle: the colours of this technique */
        --bg: var(--stage-bg); --ink: #f5f2ea; --accent: #ff6a3d; --accent-2: #ffc247;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--stage-bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Rubik", sans-serif; }
      #cam { position: absolute; inset: 0; transform-origin: 540px 900px; }
      .light { position: absolute; width: 1300px; height: 1300px; border-radius: 50%; }
      #light-a { left: -420px; top: 60px; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 60%, transparent) 0%, transparent 64%); }
      #light-b { left: 240px; top: 760px; background: radial-gradient(circle, color-mix(in srgb, var(--accent-2) 38%, transparent) 0%, transparent 64%); }
      .line { position: absolute; left: 80px; right: 80px; text-align: center; white-space: nowrap; line-height: 1; color: var(--ink); }
      #l1, #l2 { font-size: 220px; font-weight: 900; }
      #l1 { top: 640px; }
      #l2 { top: 860px; opacity: 0; }
      #l3 { top: 1130px; font-size: 92px; font-weight: 500; opacity: 0; }
      /* the two finishing layers: full frame, outside the camera, never animated */
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 78% 64% at 50% 48%, transparent 52%, rgba(0, 0, 0, 0.6) 100%); }
      #grain { position: absolute; inset: 0; background-repeat: repeat; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="cam">
        <div class="light" id="light-a"></div>
        <div class="light" id="light-b"></div>
        <div class="line" id="l1" dir="rtl">הכותרת</div>
        <div class="line" id="l2" dir="rtl">שלכם</div>
        <div class="line" id="l3" dir="rtl">שורת משנה קצרה</div>
      </div>
      <div id="vignette"></div>
      <div id="grain"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      // Seeded random (mulberry32): the same grain on every render. Never Math.random().
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(1977);

      // ---- restyle here
      const DUR = 3;
      const GRAIN = 0.14;      // strength: the highest opacity a speck can have
      const GRAIN_PX = 2;      // speck size in frame pixels
      const TILE = 512;        // the grain repeats every TILE px; too small and the eye finds the pattern

      // The grain, once: every speck is black or white with a random opacity up to GRAIN.
      const side = TILE / GRAIN_PX, canvas = document.createElement("canvas");
      canvas.width = canvas.height = side;
      const ctx = canvas.getContext("2d"), image = ctx.createImageData(side, side);
      for (let i = 0; i < image.data.length; i += 4) {
        const tone = rnd() < 0.5 ? 0 : 255;
        image.data[i] = image.data[i + 1] = image.data[i + 2] = tone;
        image.data[i + 3] = Math.round(255 * GRAIN * rnd());
      }
      ctx.putImageData(image, 0, 0);
      const grain = document.getElementById("grain");
      grain.style.backgroundImage = "url(" + canvas.toDataURL() + ")";
      grain.style.backgroundSize = TILE + "px " + TILE + "px";

      const tl = gsap.timeline({ paused: true });
      // the scene under the grain moves and scales; the grain and the vignette do not
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.08, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#light-a", { x: -60, y: 40 }, { x: 80, y: -50, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#light-b", { x: 70, y: -30 }, { x: -70, y: 60, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#l1", { y: 40, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.24, ease: "back.out(1.6)" }, 0);
      tl.fromTo("#l2", { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.26, ease: "back.out(2.2)" }, 0.22);
      tl.fromTo("#l3", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.26, ease: "power3.out" }, 0.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
