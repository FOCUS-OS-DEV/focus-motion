<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Cookbook: carry-across-a-cut
      What    One element survives a hard cut and becomes something else. A chip launches upward out of the first
              shot, the cut lands while it is gone, and it flies into the second shot from below, still going up,
              and docks as the title of a card.
      How     The chip is not inside either shot. It sits above both, so the cut changes everything behind it and
              not the chip. It leaves through the top edge with a trail, the shots are switched on that frame, and
              the same element comes in from the bottom edge and slows down into its new place and size.
      Change  Colours in :root. The chip's word, both shots, T_GO, T_CUT, the docking place (DOCK_Y, DOCK_SCALE),
              and what the chip becomes.
      Traps   Keep the direction of travel: out through the top means in through the bottom. Keep the colour and
              the shape of the element, or the eye reads two different things. Cut on the frame it is fully out of
              the frame. One carried element per cut. The same recipe turns a full-frame picture into a small card:
              animate the size and corner radius of one element instead of swapping two.
    -->
    <style>
      /* fonts:start */
      @font-face { font-family: "Rubik"; src: url("assets/Rubik-VF.ttf") format("truetype"); font-weight: 300 900; }
      /* fonts:end */
      :root { --bg: #0f1216; --ink: #f5f2ea; --accent: #ff6a3d; --accent-2: #ffc247; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Rubik", sans-serif; }
      #cam { position: absolute; inset: 0; transform-origin: 540px 900px; }
      .shot { position: absolute; inset: 0; visibility: hidden; }
      #shotA { background: var(--bg); }
      #shotB { background: var(--ink); }
      #glow { position: absolute; left: 540px; top: 860px; width: 1300px; height: 900px; margin: -450px 0 0 -650px; border-radius: 50%;
              background: radial-gradient(ellipse, color-mix(in srgb, var(--accent) 45%, transparent) 0%, transparent 64%); }
      #card { position: absolute; left: 140px; top: 540px; width: 800px; height: 760px; border-radius: 52px; background: var(--bg);
              box-shadow: 0 50px 100px rgba(15, 18, 22, 0.3); padding-top: 190px; }
      .item { display: flex; align-items: center; gap: 34px; height: 170px; padding: 0 64px; opacity: 0;
              font-size: 84px; font-weight: 700; line-height: 1; white-space: nowrap; color: var(--ink); }
      .item i { flex: none; width: 60px; height: 60px; border-radius: 50%; background: var(--accent-2); }
      #trail { position: absolute; left: 470px; top: -440px; width: 140px; height: 1300px; border-radius: 70px; transform-origin: 50% 100%;
               background: linear-gradient(180deg, #fff 0%, var(--accent-2) 22%, color-mix(in srgb, var(--accent) 60%, transparent) 60%, transparent 100%);
               filter: blur(6px); opacity: 0; }
      /* The chip lives above both shots. */
      #chipPos { position: absolute; left: 0; right: 0; top: 760px; height: 200px; display: flex; justify-content: center; }
      #chip { height: 200px; padding: 0 76px; border-radius: 100px; display: flex; align-items: center; white-space: nowrap;
              font-size: 116px; font-weight: 800; line-height: 1; color: var(--bg); background: var(--accent);
              box-shadow: 0 0 70px color-mix(in srgb, var(--accent) 60%, transparent), 0 30px 70px rgba(0, 0, 0, 0.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.8" data-width="1080" data-height="1920">
      <div id="cam">
        <div class="shot" id="shotA"><div id="glow"></div></div>
        <div class="shot" id="shotB">
          <div id="card" dir="rtl">
            <div class="item"><i></i><span>עיצוב חדש</span></div>
            <div class="item"><i></i><span>מהיר יותר</span></div>
            <div class="item"><i></i><span>פשוט יותר</span></div>
          </div>
        </div>
        <div id="trail"></div>
        <div id="chipPos"><div id="chip" dir="rtl">גרסה חדשה</div></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};

      // ---- restyle here
      const DUR = 3.8, FPS = 30;
      const T_GO = 1.3;                 // the chip takes off
      const T_CUT = 1.6;                // the cut: the chip is out of the frame
      const DOCK_Y = -265;              // where the chip docks in the second shot, from its first place
      const DOCK_SCALE = 0.82;

      const tl = gsap.timeline({ paused: true });
      const later = (sel, from, to, at) => tl.fromTo(sel, from, { ...to, immediateRender: false }, at);
      // The time of a whole frame, a hair early: what is written there shows on exactly that frame.
      const frame = (t, i = 0) => Math.max(0, (Math.round(t * FPS) + i) / FPS - 0.002);

      tl.fromTo("#cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);

      // ---- Shot A: the chip is caught mid slam on frame 0, then holds and breathes.
      tl.set("#shotA", { autoAlpha: 1 }, 0);
      tl.fromTo("#chip", { scale: 1.18 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0);
      tl.fromTo("#glow", { scale: 0.7, opacity: 0.6 }, { scale: 1.15, opacity: 1, duration: T_GO, ease: "sine.inOut" }, 0);
      later("#chip", { scale: 1 }, { scale: 1.04, duration: T_GO - 0.4, ease: "sine.inOut" }, 0.3);

      // ---- The launch: three frames of rumble, then up and out through the top edge, with a trail.
      [[-9, 0], [8, 0], [-6, 0], [0, 0]].forEach(([x, y], i) => tl.set("#chipPos", { x, y }, frame(T_GO - 0.1, i)));
      later("#chip", { y: 0, scaleX: 1.04, scaleY: 1.04 }, { y: -1350, scaleX: 0.86, scaleY: 1.22, duration: T_CUT - T_GO, ease: "power3.in" }, T_GO);
      later("#trail", { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: T_CUT - T_GO, ease: "power3.in" }, T_GO);

      // ---- The cut: everything behind the chip changes on one frame.
      tl.set("#shotA", { autoAlpha: 0 }, frame(T_CUT));
      tl.set("#shotB", { autoAlpha: 1 }, frame(T_CUT));
      tl.set("#trail", { autoAlpha: 0 }, frame(T_CUT));

      // ---- Shot B: the same chip arrives from below, still travelling up, and docks as the title of the card.
      // It starts just inside the bottom edge, so the first frame after the cut is not an empty one.
      later("#chip", { y: 900, scaleX: 0.86, scaleY: 1.22 }, { y: DOCK_Y, scaleX: DOCK_SCALE, scaleY: DOCK_SCALE, duration: 0.55, ease: "expo.out" }, T_CUT);
      tl.fromTo("#card", { y: 1250 }, { y: 0, duration: 0.6, ease: "expo.out" }, T_CUT);
      gsap.utils.toArray(".item").forEach((el, i) =>
        tl.fromTo(el, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.24, ease: "power3.out" }, T_CUT + 0.6 + i * 0.2));
      later("#chip", { rotation: 0 }, { rotation: -2, duration: DUR - T_CUT - 0.7, ease: "sine.inOut" }, T_CUT + 0.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
