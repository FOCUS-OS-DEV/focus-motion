<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Cookbook: crowd-silhouettes
      What    An audience seen from behind: heads and shoulders rise into the bottom of the frame, one after the
              other, and keep shifting a little while they watch the screen in front of them.
      How     A person is two shapes: a circle for the head and a box with a rounded top for the shoulders, both in
              the background colour, with a thin rim of light on their top edge that takes its colour from what they
              look at. Sizes and heights are seeded, so no two are alike. They rise with a small overshoot, in
              reading order, then each sways on its own seeded rhythm.
      Change  Colours in :root. PEOPLE (centre x of each, right to left), HEAD and SHOULDERS sizes, T_RISE, the
              screen and its words. Change --rim to the colour of your screen.
      Traps   Silhouettes need light behind them: on a dark frame they vanish without the screen and its glow. Keep
              them below the text and out of the centre. They are a frame for the message, not the message. People
              who stand perfectly still read as cardboard: the sway is small but it never stops.
    -->
    <style>
      /* fonts:start */
      @font-face { font-family: "Rubik"; src: url("assets/Rubik-VF.ttf") format("truetype"); font-weight: 300 900; }
      /* fonts:end */
      :root {
        --w: 1080px; --h: 1920px;
        --safe-top: 250px; --safe-bottom: 350px; --safe-left: 80px; --safe-right: 80px; --safe-right-low: 140px;
        --stage-bg: #0f1216;
        /* restyle: the colours of this technique */
        --bg: var(--stage-bg); --ink: #f5f2ea; --accent: #ff6a3d; --accent-2: #ffc247; --rim: #ffc247;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--stage-bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Rubik", sans-serif; }
      #cam { position: absolute; inset: 0; transform-origin: 540px 800px; }
      #glow { position: absolute; left: 540px; top: 1080px; width: 1700px; height: 1700px; margin: -850px 0 0 -850px; border-radius: 50%;
              background: radial-gradient(circle, color-mix(in srgb, var(--accent) 46%, transparent) 0%, color-mix(in srgb, var(--accent) 14%, transparent) 40%, transparent 66%); }
      #screen { position: absolute; left: 110px; top: 420px; width: 860px; height: 600px; border-radius: 48px; background: var(--ink);
                box-shadow: 0 0 120px color-mix(in srgb, var(--accent-2) 50%, transparent); transform-origin: 50% 50%; }
      #screen .bar { position: absolute; left: 0; right: 0; top: 0; height: 110px; border-radius: 48px 48px 0 0; background: var(--accent); }
      #screen .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; line-height: 1; font-size: 170px; font-weight: 900; color: var(--bg); }
      #crowd { position: absolute; inset: 0; transform-origin: 540px 1920px; }
      .person { position: absolute; left: 0; top: 0; }
      .person i { position: absolute; display: block; background: var(--bg); box-shadow: inset 0 9px 10px -5px var(--rim); }
      .person .head { border-radius: 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.2" data-width="1080" data-height="1920">
      <div id="cam">
        <div id="glow"></div>
        <div id="screen">
          <div class="bar"></div>
          <div class="line" dir="rtl" style="top: 170px">הקהל</div>
          <div class="line" dir="rtl" style="top: 360px">שלכם</div>
        </div>
      </div>
      <div id="crowd"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      // Seeded random (mulberry32): the same audience on every render. Never Math.random().
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(12);

      // ---- restyle here
      const DUR = 3.2;
      const PEOPLE = [950, 745, 540, 335, 130];     // centre of each person, listed right to left (the order they rise)
      const HEAD = [124, 16], SHOULDERS = [262, 20]; // size, and how much it may vary
      const TOP = 1470;                              // where the heads end up, give or take 28 px
      const T_RISE = 0.45;                           // the first person; the others follow 50 ms apart

      const tl = gsap.timeline({ paused: true });
      const later = (sel, from, to, at) => tl.fromTo(sel, from, { ...to, immediateRender: false }, at);

      // the screen is already landing on frame 0, then it and the light breathe to the last frame
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#screen", { scale: 1.1, rotation: -2 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.6)" }, 0);
      tl.fromTo("#glow", { scale: 0.85, opacity: 0.75 }, { scale: 1.1, opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);
      // the audience is nearer to the camera than the screen, so the same push moves it more
      tl.fromTo("#crowd", { scale: 1 }, { scale: 1.09, duration: DUR, ease: "none" }, 0);

      const crowd = document.getElementById("crowd");
      PEOPLE.forEach((x, i) => {
        const head = HEAD[0] + HEAD[1] * (rnd() - 0.5), wide = SHOULDERS[0] + SHOULDERS[1] * (rnd() - 0.5), top = TOP + 56 * (rnd() - 0.5);
        const person = document.createElement("div");
        person.className = "person";
        // the shoulders start under the chin and run off the bottom of the frame; their top is half an ellipse
        person.innerHTML =
          `<i style="left: ${(x - wide / 2).toFixed(0)}px; top: ${(top + head * 0.84).toFixed(0)}px; width: ${wide.toFixed(0)}px; height: 700px; border-radius: ${(wide / 2).toFixed(0)}px ${(wide / 2).toFixed(0)}px 0 0 / ${(wide * 0.36).toFixed(0)}px ${(wide * 0.36).toFixed(0)}px 0 0"></i>` +
          `<i class="head" style="left: ${(x - head / 2).toFixed(0)}px; top: ${top.toFixed(0)}px; width: ${head.toFixed(0)}px; height: ${head.toFixed(0)}px"></i>`;
        crowd.appendChild(person);
        const t0 = T_RISE + i * 0.05, sway = 10 + 10 * rnd(), lean = (rnd() < 0.5 ? -1 : 1) * (0.6 + 0.8 * rnd()), half = (DUR - t0 - 0.34) / 2;
        gsap.set(person, { y: 480, transformOrigin: x + "px 1920px" });
        later(person, { y: 480 }, { y: 0, duration: 0.34, ease: "back.out(1.3)" }, t0);
        // after the rise: one slow shift of weight there and back, each person on its own size and direction
        later(person, { y: 0, rotation: 0 }, { y: sway, rotation: lean, duration: half, ease: "sine.inOut" }, t0 + 0.34);
        later(person, { y: sway, rotation: lean }, { y: sway * 0.3, rotation: -lean * 0.4, duration: half, ease: "sine.inOut" }, t0 + 0.34 + half);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
