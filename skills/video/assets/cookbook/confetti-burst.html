<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Cookbook: confetti-burst
      What    A burst of paper pieces from one point: they shoot up in a fan, slow down, tumble, and drift down past
              the frame while the word they celebrate stays readable.
      How     Each piece gets a seeded launch angle, speed, air drag, spin and flutter. draw(t) places it from the
              exact solution of "drag plus gravity", so a piece rises, hangs and then falls at its own steady speed
              like paper does. The flutter is a vertical squash that swings between 1 and 0.25.
      Change  Colours in :root and COLORS. COUNT, ORIGIN, SPREAD (degrees), SPEED, GRAVITY, T_POP, and the word.
      Traps   The pieces sit under the badge and the word in the page order, so they never cover the text. Use the
              palette, not a rainbow. One burst per video is a peak; a burst on every success is noise.
    -->
    <style>
      /* fonts:start */
      @font-face { font-family: "Rubik"; src: url("assets/Rubik-VF.ttf") format("truetype"); font-weight: 300 900; }
      /* fonts:end */
      :root {
        --w: 1080px; --h: 1920px;
        --safe-top: 250px; --safe-bottom: 350px; --safe-left: 80px; --safe-right: 80px; --safe-right-low: 140px;
        --stage-bg: #0f1216;
        /* restyle: the colours of this technique */
        --bg: var(--stage-bg); --ink: #f5f2ea; --accent: #ff6a3d; --accent-2: #ffc247;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--stage-bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Rubik", sans-serif; }
      #cam, #kick { position: absolute; inset: 0; transform-origin: 540px 900px; }
      .bit { position: absolute; left: 0; top: 0; opacity: 0; }
      #badge { position: absolute; left: 540px; top: 780px; width: 0; height: 0; }
      #badge svg { position: absolute; left: -220px; top: -220px; width: 440px; height: 440px; overflow: visible; }
      #plate { fill: color-mix(in srgb, var(--ink) 10%, transparent); }
      #fill { fill: var(--accent); }
      #ring { fill: none; stroke: var(--accent-2); stroke-width: 16; stroke-linecap: round; }
      #check { fill: none; stroke: var(--ink); stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
      #word { position: absolute; left: 0; right: 0; top: 1040px; text-align: center; white-space: nowrap; line-height: 1;
              font-size: 230px; font-weight: 900; color: var(--ink); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.6" data-width="1080" data-height="1920">
      <div id="cam">
        <div id="kick">
          <div id="bits"></div>
          <div id="badge">
            <svg viewBox="-220 -220 440 440">
              <circle id="plate" r="150" />
              <circle id="fill" r="0" />
              <circle id="ring" r="190" pathLength="1" stroke-dasharray="1" transform="rotate(-90)" />
              <path id="check" d="M -62 6 L -20 48 L 64 -42" pathLength="1" stroke-dasharray="1" />
            </svg>
          </div>
          <div id="word" dir="rtl">הושלם</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      // Seeded random (mulberry32): the same burst on every render. Never Math.random().
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(2026);

      // ---- restyle here
      const DUR = 3.6, COUNT = 90;
      const T_POP = 0.4;                       // the burst, on the beat or the word
      const ORIGIN = [540, 780];               // where the pieces come from (the badge centre)
      const SPREAD = 150;                      // the fan, in degrees, centred straight up
      const SPEED = [1300, 3300];              // launch speed, px per second
      const GRAVITY = 2300;
      const COLORS = ["var(--accent)", "var(--accent-2)", "var(--ink)"];

      const host = document.getElementById("bits");
      const bits = Array.from({ length: COUNT }, (_, i) => {
        const el = document.createElement("div"), w = 18 + 22 * rnd(), round = rnd() < 0.3;
        el.className = "bit";
        Object.assign(el.style, { width: w.toFixed(0) + "px", height: (round ? w : w * (0.4 + 0.3 * rnd())).toFixed(0) + "px",
                                  borderRadius: round ? "50%" : "4px", background: COLORS[i % COLORS.length] });
        host.appendChild(el);
        const ang = (-90 + SPREAD * (rnd() - 0.5)) * Math.PI / 180, v = SPEED[0] + (SPEED[1] - SPEED[0]) * rnd();
        return { el, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, k: 2 + 1.6 * rnd(),      // k is the air drag of this piece
                 delay: 0.06 * rnd(), spin: 900 * (rnd() - 0.5), r0: 360 * rnd(), flutter: 7 + 9 * rnd(), phase: 6.28 * rnd(), sway: 40 * rnd() };
      });

      function draw(t) {
        for (const c of bits) {
          const tau = t - T_POP - c.delay;
          if (tau <= 0) { c.el.style.opacity = 0; continue; }
          const e = 1 - Math.exp(-c.k * tau), fall = GRAVITY / c.k;                          // fall: the steady speed it ends at
          const x = ORIGIN[0] + c.vx * e / c.k + c.sway * e * Math.sin(c.flutter * 0.6 * tau + c.phase);
          const y = ORIGIN[1] + fall * tau + (c.vy - fall) * e / c.k;
          const grow = Math.min(1, tau * 14), flip = 0.25 + 0.75 * Math.abs(Math.cos(c.flutter * tau + c.phase));
          c.el.style.opacity = 1;
          c.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(c.r0 + c.spin * tau).toFixed(1)}deg) scale(${grow.toFixed(2)}, ${(grow * flip).toFixed(2)})`;
        }
      }

      const tl = gsap.timeline({ paused: true });
      // The clock: GSAP writes clock.t on every frame it is asked for, and the setter redraws.
      const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; draw(v); } };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);

      // before: the ring closes, so frame 0 is already moving toward the beat
      tl.fromTo("#ring", { attr: { "stroke-dashoffset": 0.5 } }, { attr: { "stroke-dashoffset": 0 }, duration: T_POP, ease: "power2.in" }, 0);
      // the beat: the badge fills from its centre, the check draws, the ring leaves as a shockwave, the frame kicks
      // (SVG shapes grow through their own attributes: a GSAP scale on an SVG child also moves it)
      tl.fromTo("#fill", { attr: { r: 0 } }, { attr: { r: 150 }, duration: 0.22, ease: "back.out(2)", immediateRender: false }, T_POP);
      tl.fromTo("#ring", { attr: { r: 190 }, opacity: 1 }, { attr: { r: 300 }, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, T_POP);
      tl.fromTo("#check", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, T_POP + 0.06);
      tl.fromTo("#check", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.22, ease: "power2.out", immediateRender: false }, T_POP + 0.06);
      tl.fromTo("#kick", { scale: 1.04 }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, T_POP);
      tl.fromTo("#word", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(2.2)", immediateRender: false }, T_POP + 0.12);
      tl.fromTo("#badge, #word", { y: 0 }, { y: -14, duration: DUR - T_POP - 0.5, ease: "sine.inOut", immediateRender: false }, T_POP + 0.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
