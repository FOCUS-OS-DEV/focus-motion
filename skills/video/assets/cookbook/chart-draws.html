<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Cookbook: chart-draws
      What    A bar chart builds itself: the bars grow one after another, a line draws across their tops, each point
              pops as the line reaches it, and the value lands when the line arrives at the last day.
      How     Every position comes from VALUES, so nothing is measured. The bars grow from their base in a stagger.
              The line is one SVG polyline with pathLength 1, so drawing it is a tween of its dash offset from 1 to
              0 (as attributes). The time the line reaches a point is worked out from the point's share of the length and the ease.
              The value counts with the same timing and ease, so the number and the line arrive together.
      Change  Colours in :root. VALUES, DAYS, VALUE, the plot box (PLOT), T_BARS, T_LINE, LINE_DUR, the title.
      Traps   A Hebrew chart reads right to left: the first day is on the right and the line draws toward the left.
              A number never overshoots: no back or elastic ease on a value. A line with round caps shows a dot
              before it starts, so it stays hidden until it starts. Five to seven bars: a chart in a video is read in
              a second.
    -->
    <style>
      /* fonts:start */
      @font-face { font-family: "Rubik"; src: url("assets/Rubik-VF.ttf") format("truetype"); font-weight: 300 900; }
      /* fonts:end */
      :root { --bg: #0f1216; --ink: #f5f2ea; --accent: #ff6a3d; --accent-2: #ffc247; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Rubik", sans-serif; }
      #cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
      #glow { position: absolute; left: 540px; top: 960px; width: 1500px; height: 1400px; margin: -700px 0 0 -750px; border-radius: 50%;
              background: radial-gradient(ellipse, color-mix(in srgb, var(--accent) 28%, transparent) 0%, transparent 62%); }
      #card { position: absolute; left: 90px; top: 450px; width: 900px; height: 1010px; border-radius: 56px; background: var(--ink); color: var(--bg);
              box-shadow: 0 60px 120px rgba(0, 0, 0, 0.55); }
      #title { position: absolute; right: 70px; top: 66px; font-size: 60px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
      #value { position: absolute; right: 70px; top: 150px; font-size: 150px; font-weight: 900; line-height: 1; direction: ltr;
               font-variant-numeric: tabular-nums; color: var(--accent); transform-origin: 100% 60%; }
      .grid { position: absolute; left: 70px; right: 70px; height: 3px; background: color-mix(in srgb, var(--bg) 8%, transparent); }
      .bar { position: absolute; width: 66px; border-radius: 16px 16px 6px 6px; background: color-mix(in srgb, var(--accent) 38%, var(--ink));
             transform-origin: 50% 100%; }
      .bar.last { background: var(--accent); }
      .day { position: absolute; top: 920px; width: 80px; text-align: center; font-size: 40px; font-weight: 600; line-height: 1;
             color: color-mix(in srgb, var(--bg) 55%, transparent); }
      #plot { position: absolute; left: 0; top: 0; width: 900px; height: 1010px; overflow: visible; }
      #line { fill: none; stroke: var(--bg); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
      .dot { fill: var(--ink); stroke: var(--bg); stroke-width: 6; }
      .dot.last { fill: var(--accent); }
      #pulse { fill: none; stroke: var(--accent); stroke-width: 6; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.4" data-width="1080" data-height="1920">
      <div id="cam">
        <div id="glow"></div>
        <div id="card" dir="rtl">
          <div id="title">צפיות השבוע</div>
          <div id="value">+0%</div>
          <div id="bars"></div>
          <svg id="plot" viewBox="0 0 900 1010"><circle id="pulse" r="18" /></svg>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};

      // ---- restyle here
      const DUR = 3.4;
      const VALUES = [0.34, 0.5, 0.42, 0.62, 0.55, 0.78, 0.96];   // the first day first; the chart draws right to left
      const DAYS = ["א", "ב", "ג", "ד", "ה", "ו", "ש"];
      const VALUE = 32;                                           // the number that lands with the line
      const PLOT = { left: 70, right: 830, base: 900, height: 470, lift: 36 };   // in card pixels
      const T_BARS = 0.25, T_LINE = 1.0, LINE_DUR = 0.9;

      const tl = gsap.timeline({ paused: true });
      const later = (sel, from, to, at) => tl.fromTo(sel, from, { ...to, immediateRender: false }, at);
      const svg = document.getElementById("plot"), NS = svg.namespaceURI, card = document.getElementById("card");

      // ---- build from the data: grid, bars, days, the line and its points
      const pitch = (PLOT.right - PLOT.left) / VALUES.length;
      const tops = VALUES.map((v, i) => [PLOT.right - pitch * (i + 0.5), PLOT.base - v * PLOT.height]);
      let html = [1, 2, 3].map((k) => '<i class="grid" style="top:' + (PLOT.base - k * PLOT.height / 3) + 'px"></i>').join("");
      tops.forEach(([x, y], i) => {
        html += '<i class="bar' + (i === tops.length - 1 ? " last" : "") + '" style="left:' + (x - 33) + "px;top:" + y + "px;height:" + (PLOT.base - y) + 'px"></i>' +
                '<span class="day" style="left:' + (x - 40) + 'px">' + DAYS[i] + "</span>";
      });
      document.getElementById("bars").innerHTML = html;
      const pts = tops.map(([x, y]) => [x, y - PLOT.lift]);
      const line = document.createElementNS(NS, "polyline");
      // The dash is set and moved as ATTRIBUTES: on an element with pathLength, a dash offset written as CSS does not draw.
      Object.entries({ id: "line", points: pts.map((p) => p.join(",")).join(" "), pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1 })
        .forEach(([k, v]) => line.setAttribute(k, v));
      svg.insertBefore(line, svg.firstChild);
      // The share of the line's length at each point, and the inverse of the line's ease (sine.inOut).
      const lens = [0];
      for (let i = 1; i < pts.length; i++) lens.push(lens[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      const reached = (i) => T_LINE + LINE_DUR * Math.acos(1 - 2 * lens[i] / lens[lens.length - 1]) / Math.PI;
      pts.forEach(([x, y], i) => {
        const c = document.createElementNS(NS, "circle"), last = i === pts.length - 1;
        Object.entries({ cx: x, cy: y, r: last ? 18 : 13, class: "dot" + (last ? " last" : "") }).forEach(([k, v]) => c.setAttribute(k, v));
        svg.appendChild(c);
        tl.fromTo(c, { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2.6)", transformOrigin: "50% 50%" }, reached(i) - 0.03);
      });

      tl.fromTo("#cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#glow", { scale: 0.85, opacity: 0.6 }, { scale: 1.1, opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#card", { y: 70 }, { y: 0, duration: 0.7, ease: "expo.out" }, 0);              // frame 0 is already moving

      // the bars, in reading order (right to left)
      tl.fromTo(".bar", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "back.out(1.3)", stagger: 0.07 }, T_BARS);
      // the line, and the value with the same timing and ease
      tl.set("#line", { opacity: 1 }, T_LINE);
      tl.fromTo("#line", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: LINE_DUR, ease: "sine.inOut" }, T_LINE);
      const value = document.getElementById("value");
      const count = { _v: 0, get v() { return this._v; }, set v(x) { this._v = x; value.textContent = "+" + Math.round(x) + "%"; } };
      tl.fromTo(count, { v: 0 }, { v: VALUE, duration: LINE_DUR, ease: "sine.inOut" }, T_LINE);
      // it lands: the value pops, a ring goes out from the last point, the last bar keeps breathing
      const T_END = T_LINE + LINE_DUR, [lx, ly] = pts[pts.length - 1];
      later("#value", { scale: 1 }, { scale: 1.1, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, T_END);
      tl.fromTo("#pulse", { attr: { cx: lx, cy: ly, r: 18 }, opacity: 0.9 }, { attr: { cx: lx, cy: ly, r: 80 }, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, T_END);
      later(".bar.last", { scaleY: 1 }, { scaleY: 1.04, duration: DUR - T_END - 0.2, ease: "sine.inOut" }, T_END + 0.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
