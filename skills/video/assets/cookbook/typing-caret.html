<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Cookbook: typing-caret
      What    A Hebrew sentence is typed into an input field, letter by letter in reading order. The caret sits on
              the left of the text, where the next letter will go, and the send button wakes up and is pressed.
      How     The field is a right to left row: the text first, the caret after it, so the caret is always at the
              left end of what was typed. One tween moves a clock, and draw(t) shows as many characters as are due
              at that time. The rhythm is uneven and seeded: a space takes longer than a letter.
      Change  Colours in :root. TEXT, T_TYPE, TYPE_DUR, T_SEND, the label, the size of the field.
      Traps   The caret is on the LEFT of Hebrew text. The text is drawn from the clock, not by timers, so any frame
              can be asked for in any order. Keep white-space: pre on the text, or a typed space collapses and the
              caret stands still for a beat. A Latin word inside the sentence grows the other way: type it whole.
              The caret blinks only while nothing is typed.
    -->
    <style>
      /* fonts:start */
      @font-face { font-family: "Rubik"; src: url("assets/Rubik-VF.ttf") format("truetype"); font-weight: 300 900; }
      /* fonts:end */
      :root { --bg: #0f1216; --ink: #f5f2ea; --accent: #ff6a3d; --accent-2: #ffc247; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Rubik", sans-serif; }
      #cam { position: absolute; inset: 0; transform-origin: 540px 880px; }
      #glow { position: absolute; left: 540px; top: 880px; width: 1500px; height: 1200px; margin: -600px 0 0 -750px; border-radius: 50%;
              background: radial-gradient(ellipse, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 64%); }
      #panel { position: absolute; left: 60px; top: 650px; width: 960px; height: 440px; border-radius: 56px; background: var(--ink);
               box-shadow: 0 50px 110px rgba(0, 0, 0, 0.5); }
      #label { position: absolute; right: 64px; top: 52px; font-size: 60px; font-weight: 700; line-height: 1; white-space: nowrap;
               color: color-mix(in srgb, var(--bg) 62%, transparent); }
      /* The field is a right to left row: text first, caret after it, so the caret sits to the LEFT of the text. */
      #field { position: absolute; left: 44px; right: 44px; top: 176px; height: 196px; border-radius: 98px; direction: rtl;
               display: flex; align-items: center; padding: 0 60px 0 210px;
               background: color-mix(in srgb, var(--bg) 6%, transparent); border: 5px solid var(--accent); }
      #typed { font-size: 86px; font-weight: 600; line-height: 1; white-space: pre; color: var(--bg); }
      #caret { flex: none; width: 8px; height: 104px; margin-right: 12px; border-radius: 4px; background: var(--accent); }
      #ring { position: absolute; inset: -5px; border-radius: 98px; border: 6px solid var(--accent); opacity: 0; }
      #send { position: absolute; left: 22px; top: 22px; width: 142px; height: 142px; border-radius: 50%;
              background: color-mix(in srgb, var(--bg) 16%, transparent); }
      #send svg { position: absolute; left: 39px; top: 39px; width: 64px; height: 64px; }
      #sendOn { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.4" data-width="1080" data-height="1920">
      <div id="cam">
        <div id="glow"></div>
        <div id="panel" dir="rtl">
          <div id="label">שאלה חדשה</div>
          <div id="field">
            <span id="typed"></span><span id="caret"></span>
            <div id="ring"></div>
            <div id="send"><div id="sendOn"></div>
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6" /></svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      // Seeded random (mulberry32): the same typing rhythm on every render. Never Math.random().
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rnd = mulberry32(7);

      // ---- restyle here
      const DUR = 3.4;
      const TEXT = "מה נבנה היום?";
      const T_TYPE = 0.55;      // the first character
      const TYPE_DUR = 1.25;    // the whole sentence takes this long
      const T_SEND = 2.35;      // the send button is pressed
      const BLINK = 0.26;       // half a blink of the waiting caret

      // When each character appears: letters 0.75 to 1.25 units apart, a space 1.5 units.
      const gaps = Array.from(TEXT, (c, i) => (i === 0 ? 0 : c === " " ? 1.5 : 0.75 + 0.5 * rnd()));
      const total = gaps.reduce((a, b) => a + b, 0);
      let sum = 0;
      const times = gaps.map((g) => T_TYPE + TYPE_DUR * (sum += g) / total);
      const T_DONE = times[times.length - 1];

      const typed = document.getElementById("typed"), caret = document.getElementById("caret");
      function draw(t) {
        typed.textContent = TEXT.slice(0, times.filter((at) => at <= t).length);
        const waiting = t < T_TYPE - 0.1 || t > T_DONE + 0.2;
        caret.style.opacity = waiting && Math.floor(t / BLINK) % 2 === 1 ? 0.12 : 1;
      }

      const tl = gsap.timeline({ paused: true });
      const later = (sel, from, to, at) => tl.fromTo(sel, from, { ...to, immediateRender: false }, at);
      // The clock: GSAP writes clock.t on every frame it is asked for, and the setter redraws.
      const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; draw(v); } };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);

      tl.fromTo("#cam", { scale: 1 }, { scale: 1.05, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#glow", { scale: 0.85, opacity: 0.6 }, { scale: 1.1, opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);
      // frame 0: the panel is already settling into place
      tl.fromTo("#panel", { y: 46, scale: 0.97 }, { y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0);

      // The send button wakes up with the first character, and is pressed once the sentence is done.
      tl.fromTo("#sendOn", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, T_TYPE);
      tl.fromTo("#send", { scale: 0.86 }, { scale: 1, duration: 0.3, ease: "back.out(2.6)" }, T_TYPE);
      later("#send", { scale: 1 }, { scale: 0.84, duration: 0.08, ease: "power2.out" }, T_SEND - 0.08);
      later("#send", { scale: 0.84 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, T_SEND);
      later("#ring", { opacity: 0.9, scaleX: 1, scaleY: 1 }, { opacity: 0, scaleX: 1.05, scaleY: 1.3, duration: 0.5, ease: "power2.out" }, T_SEND);
      later("#panel", { scale: 1 }, { scale: 1.02, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, T_SEND);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
