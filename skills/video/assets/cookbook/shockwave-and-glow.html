<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Cookbook: shockwave-and-glow
      What    The dressing of a hit. A ring closes in on the centre as the wind up, the hero word slams, two rings
              race outward, and a glow blooms behind the word and then settles into a slow swell.
      How     The rings are SVG circles whose radius and stroke width are tweened as attributes, so they stay crisp at
              any size. The second ring starts two frames later and thinner, which reads as an echo. The glow is one
              radial gradient that scales up fast, then keeps growing slowly so the tail never freezes.
      Change  Colours in :root. T_HIT (put it on the beat or the word), the centre C, ring sizes, the words.
      Traps   One hit per scene gets this. Keep the frame change local: the glow is a soft disc, not a full-frame
              white flash. The shake is two frames and mostly vertical, so the wide slam frame stays in the safe area.
    -->
    <style>
      /* fonts:start */
      @font-face { font-family: "Rubik"; src: url("assets/Rubik-VF.ttf") format("truetype"); font-weight: 300 900; }
      /* fonts:end */
      :root {
        --w: 1080px; --h: 1920px;
        --safe-top: 250px; --safe-bottom: 350px; --safe-left: 80px; --safe-right: 80px; --safe-right-low: 140px;
        --stage-bg: #0f1216;
        /* restyle: the colours of this technique */
        --bg: var(--stage-bg); --ink: #f5f2ea; --accent: #ff6a3d; --accent-2: #ffc247;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--stage-bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Rubik", sans-serif; }
      #shake, #cam { position: absolute; inset: 0; }
      #cam { transform-origin: 540px 920px; }
      #glow { position: absolute; left: 540px; top: 920px; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%; opacity: 0;
              background: radial-gradient(circle, color-mix(in srgb, var(--accent) 62%, transparent) 0%, color-mix(in srgb, var(--accent) 22%, transparent) 34%, transparent 62%); }
      svg.rings { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      svg.rings circle { fill: none; opacity: 0; }
      #wind { stroke: var(--ink); }
      #ring-a, #ring-b { stroke: var(--accent-2); }
      .line { position: absolute; left: 80px; right: 80px; text-align: center; white-space: nowrap; line-height: 1; color: var(--ink); }
      #lead { top: 850px; font-size: 140px; font-weight: 800; }
      #lead .w { display: inline-block; margin: 0 18px; opacity: 0; }
      #hero { top: 790px; font-size: 270px; font-weight: 900; opacity: 0; text-shadow: 0 10px 40px color-mix(in srgb, var(--bg) 60%, transparent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.8" data-width="1080" data-height="1920">
      <div id="shake">
        <div id="cam">
          <div id="glow"></div>
          <svg class="rings" viewBox="0 0 1080 1920">
            <circle id="wind" cx="540" cy="920" r="760" />
            <circle id="ring-a" cx="540" cy="920" r="130" />
            <circle id="ring-b" cx="540" cy="920" r="90" />
          </svg>
          <div class="line" id="lead" dir="rtl"><span class="w">זה</span><span class="w">קורה</span></div>
          <div class="line" id="hero" dir="rtl">עכשיו</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};

      // ---- restyle here
      const DUR = 2.8;
      const T_LEAD = 0.34;    // the second lead-in word (the first is already arriving on frame 0)
      const T_HIT = 1.0;      // the hit: on the beat, or on the frame the word is spoken
      const SLAM = 0.26;      // how long the hero takes to settle
      const TAIL = DUR - T_HIT;

      const tl = gsap.timeline({ paused: true });
      const later = (sel, from, to, at) => tl.fromTo(sel, from, { ...to, immediateRender: false }, at);

      // ---- before the hit: the lead-in rises, a faint light waits, the camera leans in, a ring closes on the centre
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.035, duration: T_HIT * 0.8, ease: "none" }, 0);
      later("#cam", { scale: 1.035 }, { scale: 1.09, duration: T_HIT * 0.2, ease: "power2.in" }, T_HIT * 0.8);
      tl.fromTo("#lead .w:first-child", { y: 30, opacity: 0.7 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, 0);
      later("#lead .w:last-child", { y: 64, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "back.out(1.7)" }, T_LEAD);
      tl.fromTo("#glow", { scale: 0.5, opacity: 0.3 }, { scale: 0.6, opacity: 0.45, duration: T_HIT, ease: "sine.inOut" }, 0);
      tl.fromTo("#wind", { attr: { r: 760, "stroke-width": 3 }, opacity: 0.25 },
                         { attr: { r: 40, "stroke-width": 12 }, opacity: 0.8, duration: T_HIT - 0.3, ease: "power3.in" }, 0.3);
      later("#wind", { opacity: 0.8 }, { opacity: 0, duration: 0.001 }, T_HIT);

      // ---- the hit: the lead-in is pushed up and dims, the hero lands from slightly larger
      later("#lead", { y: 0, opacity: 1 }, { y: -300, opacity: 0.6, duration: 0.14, ease: "expo.out" }, T_HIT - 0.02);
      later("#hero", { opacity: 0 }, { opacity: 1, duration: 0.001 }, T_HIT);
      later("#hero", { scale: 1.25 }, { scale: 1, duration: SLAM, ease: "back.out(2.2)" }, T_HIT);
      later("#hero", { scale: 1 }, { scale: 1.035, duration: TAIL - SLAM, ease: "sine.inOut" }, T_HIT + SLAM);
      // the camera snaps back from the lean and pushes slowly to the last frame; two frames of shake
      later("#cam", { scale: 1 }, { scale: 1.06, duration: TAIL, ease: "none" }, T_HIT);
      tl.set("#shake", { x: -4, y: -18 }, T_HIT);
      tl.set("#shake", { x: 8, y: 12 }, T_HIT + 0.034);
      tl.set("#shake", { x: 0, y: 0 }, T_HIT + 0.067);

      // ---- the glow: a fast bloom, then a slow swell that never stops
      later("#glow", { scale: 0.45, opacity: 0.6 }, { scale: 1.15, opacity: 1, duration: 0.42, ease: "power2.out" }, T_HIT);
      later("#glow", { scale: 1.15, opacity: 1 }, { scale: 1.3, opacity: 0.8, duration: TAIL - 0.42, ease: "sine.inOut" }, T_HIT + 0.42);

      // ---- the shockwaves: thick and bright at the centre, thin and faint at the edge; the echo two frames later
      later("#ring-a", { attr: { r: 130, "stroke-width": 18 }, opacity: 1 }, { attr: { r: 1050, "stroke-width": 3 }, opacity: 0, duration: TAIL * 0.8, ease: "power2.out" }, T_HIT);
      later("#ring-b", { attr: { r: 90, "stroke-width": 10 }, opacity: 0.9 }, { attr: { r: 860, "stroke-width": 2 }, opacity: 0, duration: TAIL * 0.8, ease: "power2.out" }, T_HIT + 0.07);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
