<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <!--
      Cookbook: progress-and-strip
      What    A progress bar fills left to right while a strip of items under it lights up, each one at the moment
              the edge of the bar passes it. A percentage counts with the bar, and the end of the bar lands with
              a glow and a sheen.
      How     The bar fills at a constant speed (ease "none"), so the time it reaches any x is simple arithmetic:
              T_FILL + FILL * (x - left) / width. Each item lights at the time of its own centre. The percentage is
              a number whose setter writes the text, moved by a tween with the same start, length and ease.
      Change  Colours in :root. BAR (place and size), ITEMS, T_FILL, FILL, the label.
      Traps   Progress bars fill left to right, also in a Hebrew video. If you give the bar an ease, give the
              number the same ease and work the item times out through that ease, or they drift apart. The items
              stay alive while they wait (something small moves in each), dim but readable.
    -->
    <style>
      /* fonts:start */
      @font-face { font-family: "Rubik"; src: url("assets/Rubik-VF.ttf") format("truetype"); font-weight: 300 900; }
      /* fonts:end */
      :root { --bg: #0f1216; --ink: #f5f2ea; --accent: #ff6a3d; --accent-2: #ffc247; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Rubik", sans-serif; }
      #cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
      .row { position: absolute; left: 80px; right: 80px; text-align: center; white-space: nowrap; line-height: 1; color: var(--ink); }
      #label { top: 500px; font-size: 96px; font-weight: 800; }
      #pct { top: 640px; font-size: 210px; font-weight: 900; color: var(--accent-2); font-variant-numeric: tabular-nums; transform-origin: 50% 60%; }
      #barGlow { position: absolute; left: 100px; top: 900px; width: 880px; height: 220px; border-radius: 50%; opacity: 0;
                 background: radial-gradient(ellipse, color-mix(in srgb, var(--accent) 70%, transparent) 0%, transparent 68%); }
      #bar { position: absolute; left: 140px; top: 990px; width: 800px; height: 44px; border-radius: 22px; overflow: hidden;
             background: color-mix(in srgb, var(--ink) 12%, transparent); }
      #fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; border-radius: 22px; overflow: hidden;
              background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 60%, var(--accent-2) 100%); }
      #shine { position: absolute; left: 0; top: -20px; width: 120px; height: 84px; transform: translateX(-200px) skewX(-20deg);
               background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent); }
      .item { position: absolute; top: 1090px; width: 170px; height: 112px; margin-left: -85px; opacity: 0.35; }
      .pop { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; background: color-mix(in srgb, var(--ink) 14%, var(--bg)); }
      .pop i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--c); }
      .ring { position: absolute; inset: -10px; border-radius: 30px; border: 5px solid var(--accent-2); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.4" data-width="1080" data-height="1920">
      <div id="cam">
        <div class="row" id="label" dir="rtl">בונה את הסרטון</div>
        <div class="row" id="pct" dir="ltr">0%</div>
        <div id="barGlow"></div>
        <div id="bar"><div id="fill"><div id="shine"></div></div></div>
        <div id="items"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};

      // ---- restyle here
      const DUR = 3.4;
      const BAR = { left: 140, width: 800 };         // the same numbers as #bar in the CSS
      const ITEMS = ["var(--accent)", "var(--accent-2)", "var(--ink)", "var(--accent)"];   // one tile per part of the work
      const T_FILL = 0.4, FILL = 2.2;                // the bar starts, and how long it takes

      const tl = gsap.timeline({ paused: true });
      const later = (sel, from, to, at) => tl.fromTo(sel, from, { ...to, immediateRender: false }, at);

      // ---- the strip: tiles evenly under the bar, each knowing the time the bar passes its centre
      const items = document.getElementById("items");
      const passAt = ITEMS.map((c, k) => {
        const x = BAR.left + BAR.width * (k + 0.5) / ITEMS.length;
        items.insertAdjacentHTML("beforeend", '<div class="item" style="left:' + x + 'px"><div class="pop" style="--c:' + c + '"><i></i></div><div class="ring"></div></div>');
        return T_FILL + FILL * (x - BAR.left) / BAR.width;
      });

      tl.fromTo("#cam", { scale: 1 }, { scale: 1.04, duration: DUR, ease: "none" }, 0);
      // frame 0: the label and the bar are already arriving
      tl.fromTo("#label", { opacity: 0.7, y: 20 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 0);
      tl.fromTo("#bar", { y: 24, opacity: 0.6 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      // something small moves in every tile all the time, so a tile that waits is still alive
      gsap.utils.toArray(".pop i").forEach((dot, k) =>
        tl.fromTo(dot, { x: -40 + 20 * k, y: 18 }, { x: 40 - 20 * k, y: -18, duration: DUR, ease: "sine.inOut" }, 0));

      // ---- the bar and the number: same start, same length, same ease
      tl.fromTo("#fill", { width: 0 }, { width: BAR.width, duration: FILL, ease: "none" }, T_FILL);
      const pct = document.getElementById("pct");
      const count = { _v: 0, get v() { return this._v; }, set v(x) { this._v = x; pct.textContent = Math.round(x) + "%"; } };
      tl.fromTo(count, { v: 0 }, { v: 100, duration: FILL, ease: "none" }, T_FILL);

      // ---- each tile lights up as the edge of the bar passes its centre
      gsap.utils.toArray(".item").forEach((item, k) => {
        const at = passAt[k];
        tl.fromTo(item, { opacity: 0.35 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, at);
        tl.fromTo(item.querySelector(".pop"), { scale: 1 }, { scale: 1.1, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, at);
        later(item.querySelector(".ring"), { scale: 1, opacity: 1 }, { scale: 1.18, opacity: 0, duration: 0.36, ease: "power2.out" }, at);   // later(): not shown before its time
      });

      // ---- 100 percent: the glow, a sheen through the bar, the number pops
      const T_DONE = T_FILL + FILL;
      tl.fromTo("#barGlow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, T_DONE - 0.04);
      later("#barGlow", { opacity: 1, scale: 1 }, { opacity: 0.75, scale: 1.08, duration: DUR - T_DONE - 0.1, ease: "sine.inOut" }, T_DONE + 0.08);
      tl.fromTo("#shine", { x: -200 }, { x: 900, duration: 0.3, ease: "power2.inOut" }, T_DONE);
      tl.fromTo("#bar", { scale: 1 }, { scale: 1.04, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T_DONE);
      tl.fromTo("#pct", { scale: 1 }, { scale: 1.12, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, T_DONE);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
